<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ heading }}</title>
</head>
<body style="margin:0; padding:0; background:#f7f7f5; font-family:system-ui, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f5; padding:2rem 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background:#ffffff; border-radius:10px; overflow:hidden;">
        <tr>
          <td style="background:#2B2727; color:#efdaa4; padding:1.25rem 1.5rem; font-size:1.1rem; font-weight:bold;">
            {{ heading }}
          </td>
        </tr>
        <tr>
          <td style="padding:1.5rem; color:#222; font-size:1rem; line-height:1.5;">
            <p style="margin:0 0 .4rem; font-weight:bold;">{{ message_label }}</p>
            <div style="white-space:pre-wrap; background:#f7f7f5; border-left:4px solid #efdaa4; padding:.75rem 1rem; margin:0 0 1.25rem;">{{ message }}</div>

            <table role="presentation" cellpadding="0" cellspacing="0" style="font-size:.95rem; margin:0 0 1rem;">
              {% for label, value in details %}
                <tr>
                  <td style="padding:.15rem 1rem .15rem 0; color:#666; vertical-align:top; white-space:nowrap;">{{ label }}</td>
                  <td style="padding:.15rem 0;">{{ value }}</td>
                </tr>
              {% endfor %}
            </table>

            {% if link_url %}
              <p><a href="{{ link_url }}" style="color:#2B2727; font-weight:bold;">{{ link_text }}</a></p>
            {% endif %}
          </td>
        </tr>
        <tr>
          <td style="padding:1rem 1.5rem; color:#888; font-size:.8rem; border-top:1px solid #eee;">
            Automatic staff alert from the Bike + Brew passport system.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

</body>
</html>
