<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyM Passport Administration</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      color: #222;
    }
    .user-bar {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: .85rem;
      color: #666;
    }
    .user-bar button {
      background: none;
      border: none;
      color: #666;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      font: inherit;
    }
    .card {
      text-align: center;
    }
    h1 {
      font-size: 1.3rem;
      color: #444;
      margin-bottom: 2.5rem;
    }
    .big-button {
      display: inline-block;
      font-size: 1.6rem;
      font-weight: bold;
      padding: 1.5rem 3rem;
      background: #2a6b2a;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
    }
    .big-button:hover {
      background: #1f5a1f;
    }
  </style>
</head>
<body>

<div class="user-bar">
  {{ user.username }}
  <form method="post" action="{% url 'admin:logout' %}" style="display: inline;">
    {% csrf_token %}
    · <button type="submit">Log out</button>
  </form>
</div>

<div class="card">
  <h1>MyM Passport Administration</h1>
  <a class="big-button" href="{% url 'submission_new' %}">Log a Submission</a>
</div>

</body>
</html>
