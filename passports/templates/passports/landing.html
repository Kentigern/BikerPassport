<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MARK Passport Administration</title>
  <link rel="icon" href="https://makeyourmark.co.uk/wp-content/uploads/2025/08/MARK-Favicon-100x100.png">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2B2727;
      color: #efdaa4;
    }
    .user-bar {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: .85rem;
      color: #c9b998;
    }
    .user-bar button {
      background: none;
      border: none;
      color: #c9b998;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      font: inherit;
    }
    .card {
      text-align: center;
    }
    h1 {
      font-size: 1.3rem;
      color: #efdaa4;
      margin-bottom: .4rem;
    }
    .tagline {
      font-size: .95rem;
      color: #c9b998;
      margin-bottom: 2.5rem;
      font-style: italic;
    }
    .big-button {
      display: inline-block;
      font-size: 1.6rem;
      font-weight: bold;
      padding: 1.5rem 3rem;
      background: #efdaa4;
      color: #2B2727;
      text-decoration: none;
      border-radius: 10px;
    }
    .big-button:hover {
      background: #e0c785;
    }
  </style>
</head>
<body>

<div class="user-bar">
  {{ user.username }}
  <form method="post" action="{% url 'admin:logout' %}" style="display: inline;">
    {% csrf_token %}
    · <button type="submit">Log out</button>
  </form>
</div>

<div class="card">
  <h1>MARK Passport Administration</h1>
  <p class="tagline">Ride united. Heal united.</p>
  <a class="big-button" href="{% url 'submission_new' %}">Log a Submission</a>
</div>

</body>
</html>
